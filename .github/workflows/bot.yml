name: Telegram Bot Poller

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Poll Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python run.py poll-bot

      - name: Commit & push if changed
        run: |
          git config user.name "aditya-s45"
          git config user.email "adityashingare2006@gmail.com"
          git add data/users.json data/bot_state.json
          if git diff --staged --quiet; then
            echo "No new subscribers."
          else
            git commit -m "chore: update bot subscribers ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push race, retrying ($attempt)..."; sleep 5
            done
          fi
